<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Flashcards</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Flashcards">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<style>
  :root {
    --ink: #4b4b4b;
    --muted: #afafaf;
    --line: #e5e5e5;
    --ghost: #f7f7f7;
    --green: #58cc02;
    --green-dark: #58a700;
    --green-soft: #d7ffb8;
    --green-line: #a5ed6e;
    --blue: #1cb0f6;
    --blue-dark: #1899d6;
    --size: min(80vw, 44dvh, 340px);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; background: #fff; }
  body {
    font-family: ui-rounded, -apple-system, system-ui, "Hiragino Maru Gothic ProN", sans-serif;
    color: var(--ink);
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    overscroll-behavior: none;
  }
  button { font: inherit; color: inherit; background: none; border: 0; outline: none; cursor: pointer; }
  [hidden] { display: none !important; }

  .screen {
    min-height: 100dvh;
    display: flex; flex-direction: column;
    padding: calc(env(safe-area-inset-top) + 16px) 20px calc(env(safe-area-inset-bottom) + 20px);
  }

  /* Chunky buttons */
  .btn {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    height: 56px; padding: 0 20px; border-radius: 16px;
    font-size: 17px; font-weight: 700; letter-spacing: .02em;
    border: 2px solid var(--line); border-bottom-width: 4px; background: #fff;
    transition: transform .05s;
  }
  .btn:active { transform: translateY(2px); border-bottom-width: 2px; margin-bottom: 2px; }
  .btn.green { background: var(--green); border-color: var(--green-dark); color: #fff; }
  .btn.blue { background: var(--blue); border-color: var(--blue-dark); color: #fff; }
  .btn:disabled { opacity: .4; }

  /* ---------- Home ---------- */
  .home h1 { font-size: 30px; font-weight: 800; margin: 12px 0 4px; }
  .home .sub { color: var(--muted); font-size: 15px; font-weight: 600; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 24px 0; }
  .stat { border: 2px solid var(--line); border-radius: 16px; padding: 14px 8px; text-align: center; }
  .stat b { display: block; font-size: 26px; font-weight: 800; }
  .stat span { font-size: 13px; color: var(--muted); font-weight: 700; }
  .stat.due b { color: var(--blue); }
  .stat.known b { color: var(--green); }
  .label { font-size: 13px; font-weight: 800; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; margin: 18px 0 10px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    padding: 9px 14px; border-radius: 12px; font-size: 15px; font-weight: 700;
    border: 2px solid var(--line); border-bottom-width: 3px;
  }
  .chip.on { background: #ddf4ff; border-color: #84d8ff; color: var(--blue-dark); }
  .home .spacer { flex: 1; min-height: 24px; }
  .home .version { text-align: center; color: var(--line); font-size: 12px; font-weight: 700; margin-top: 10px; }
  .home .msg { text-align: center; color: var(--muted); font-weight: 700; margin-bottom: 12px; }

  /* ---------- Study ---------- */
  .topbar { display: flex; align-items: center; gap: 14px; height: 40px; }
  .close { width: 32px; height: 32px; display: grid; place-items: center; }
  .bar { flex: 1; height: 16px; border-radius: 8px; background: var(--line); overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: var(--green); border-radius: 8px; transition: width .35s; }
  .prompt { font-size: 24px; font-weight: 800; margin: 22px 0 0; }

  .stage { flex: 1; display: grid; place-items: center; padding: 44px 0 16px; }
  .pile { position: relative; width: var(--size); height: var(--size); }
  .ghost {
    position: absolute; inset: 0; border-radius: 32px;
    border: 2px solid var(--line); background: var(--ghost);
  }
  .card {
    position: absolute; inset: 0; perspective: 1200px;
    container-type: inline-size;
  }
  .card.enter { animation: enter .3s ease-out; }
  @keyframes enter { from { transform: translateY(-14px) scale(.95); } }
  .card.leave { transition: transform .3s ease-in, opacity .3s; transform: translateX(-130%) rotate(-10deg); opacity: 0; }
  .inner { position: absolute; inset: 0; transition: transform .45s cubic-bezier(.3,.7,.3,1); transform-style: preserve-3d; }
  .card.flipped .inner { transform: rotateY(180deg); }
  .face {
    position: absolute; inset: 0; border-radius: 32px; overflow: hidden;
    border: 2px solid var(--line); border-bottom-width: 5px; background: #fff;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 24px; text-align: center;
    backface-visibility: hidden; -webkit-backface-visibility: hidden;
    transition: background .25s, border-color .25s, color .25s;
  }
  .face.back { transform: rotateY(180deg); }
  .kana.sentence, .kanji.sentence { white-space: normal; line-height: 1.3; max-width: 100%; }
  .sentence span { display: inline-block; }   /* lines only break between words */
  .kana { font-family: "Hiragino Maru Gothic ProN", "Hiragino Sans", sans-serif; font-weight: 700; line-height: 1.15; white-space: nowrap; }
  .kanji { font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", sans-serif; font-weight: 600; color: #777; margin-top: 4px; }
  .en { font-weight: 800; line-height: 1.15; }
  .small { font-size: 6cqw; font-weight: 700; color: var(--muted); margin-bottom: 6px; }
  .note { font-size: 4.6cqw; font-weight: 600; color: var(--muted); margin-top: 12px; line-height: 1.3; max-width: 80%; }
  .card.correct .note { color: var(--green-dark); opacity: .75; }
  .speak {
    position: absolute; right: 18px; bottom: 16px; width: 48px; height: 48px;
    display: grid; place-items: center; color: var(--blue);
  }
  .speak:active { transform: scale(.9); }
  .sparkle, .gloss { position: absolute; opacity: 0; transition: opacity .25s; pointer-events: none; }
  .sparkle { width: 30px; height: 30px; fill: #fff; }
  .sparkle.a { top: 24px; right: 30px; }
  .sparkle.b { bottom: 30px; left: 28px; width: 22px; height: 22px; }
  .gloss {
    right: 16px; bottom: 14px; width: 18%; height: 72%;
    background: rgba(255,255,255,.65);
    clip-path: polygon(100% 0, 100% 100%, 0 100%);
    border-bottom-right-radius: 20px;
  }
  .card.correct .face { background: var(--green-soft); border-color: var(--green-line); color: var(--green-dark); }
  .card.correct .kanji, .card.correct .small { color: var(--green-dark); opacity: .75; }
  .card.correct .sparkle, .card.correct .gloss { opacity: 1; }
  .card.correct .speak { color: var(--green-dark); }

  .hint { text-align: center; color: var(--muted); font-size: 15px; font-weight: 700; min-height: 22px; margin-bottom: 14px; }
  .hint.heard { color: #ea2b2b; }
  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .actions.one { grid-template-columns: 1fr; }
  .actions.front { grid-template-columns: 2fr 1fr; }
  .actions.front .btn { font-size: 16px; padding: 0 12px; }
  .mic.listening { animation: pulse 1s infinite; }
  @keyframes pulse { 50% { filter: brightness(1.15); transform: scale(1.03); } }

  /* ---------- Done ---------- */
  .done { align-items: center; justify-content: center; text-align: center; gap: 10px; }
  .done h2 { font-size: 30px; font-weight: 800; color: var(--green); }
  .done p { color: var(--muted); font-weight: 700; font-size: 17px; margin-bottom: 30px; }
  .done .btn { width: 100%; max-width: 360px; }
</style>
</head>
<body>

<!-- Home -->
<section class="screen home" id="home">
  <h1>Flashcards</h1>
  <div class="sub" id="total"></div>
  <div class="stats">
    <div class="stat due"><b id="nDue">0</b><span>Due</span></div>
    <div class="stat"><b id="nLearning">0</b><span>Learning</span></div>
    <div class="stat known"><b id="nKnown">0</b><span>Known</span></div>
  </div>
  <div class="label">Practice</div>
  <div class="chips" id="practiceChips"></div>
  <div class="label" id="dirLabel">Show first</div>
  <div class="chips" id="dirChips"></div>
  <div class="label">Voice speed</div>
  <div class="chips" id="rateChips"></div>
  <div class="label" id="srcLabel">Words from</div>
  <div class="chips" id="srcChips"></div>
  <div class="spacer"></div>
  <div class="msg" id="homeMsg"></div>
  <button class="btn green" id="startBtn">Start</button>
  <div class="version">v17</div>
</section>

<!-- Study -->
<section class="screen" id="study" hidden>
  <div class="topbar">
    <button class="close" id="quitBtn" aria-label="Close">
      <svg width="22" height="22" viewBox="0 0 22 22"><path d="M3 3l16 16M19 3L3 19" stroke="#afafaf" stroke-width="3" stroke-linecap="round"/></svg>
    </button>
    <div class="bar"><i id="barFill"></i></div>
  </div>
  <div class="prompt" id="prompt"></div>
  <div class="stage"><div class="pile" id="pile"></div></div>
  <div class="hint" id="hint"></div>
  <div class="actions" id="actions"></div>
</section>

<!-- Done -->
<section class="screen done" id="done" hidden>
  <h2>Nice work!</h2>
  <p id="doneMsg"></p>
  <button class="btn green" id="homeBtn">Done</button>
</section>

<script src="words.js"></script>
<script>
const DAY = 864e5;
const INTERVALS = [0, 1, 2, 5, 10, 21];  // days until a card is due again, by box (a miss resets to box 1, due now)
const SESSION = 20;
const STORE = "jpcards.v1";

const SPEAKER = `<svg width="30" height="30" viewBox="0 0 24 24" fill="currentColor"><path d="M4 9h3l5-4v14l-5-4H4z"/><path d="M15.5 8.5a5 5 0 010 7M18 6a8.5 8.5 0 010 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>`;
const MIC = `<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><rect x="8" y="2" width="8" height="13" rx="4"/><path d="M5 11a7 7 0 0014 0M12 18v4" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>`;
const STAR = `<path d="M12 0C13 8 16 11 24 12C16 13 13 16 12 24C11 16 8 13 0 12C8 11 11 8 12 0Z"/>`;

const $ = id => document.getElementById(id);
const words = window.WORDS.map(w => ({ ...w, id: w.kana + "|" + (w.kanji || "") }));
const byKana = Object.fromEntries([...(window.EXTRAS || []), ...words].map(w => [w.kana, w]));
// A sentence's kanji line and accepted spellings come from its words.
const sentences = (window.SENTENCES || []).map(st => {
  const kana = st.parts.join("");
  const kanji = st.parts.map(p => byKana[p]?.kanji || p).join("");
  return { ...st, kana, kanji: kanji !== kana ? kanji : undefined, id: "sent:" + kana, sentence: true };
});

// ---------- Saved progress + settings ----------
let saved = { progress: {}, dir: "jp", src: "All", rate: "normal", practice: "words" };
try { saved = { ...saved, ...JSON.parse(localStorage.getItem(STORE)) }; } catch {}
const save = () => { try { localStorage.setItem(STORE, JSON.stringify(saved)); } catch {} };
// Each direction keeps its own progress, so a word you can recognize
// (Japanese first) keeps coming back in English first until you can say it.
const key = (w, side) => w.sentence ? w.id : (side === "en" ? "say:" : "") + w.id;
const prog = (w, side) => saved.progress[key(w, side)] || { box: 0, due: 0 };

// ---------- Home ----------
const PRACTICE = [["words", "Words"], ["sentences", "Sentences"]];
const DIRS = [["jp", "Japanese"], ["en", "English"], ["mix", "Mix"]];
const RATES = [["normal", "Normal"], ["slow", "Slow"]];

function inDeck(w) { return saved.src === "All" || w.src.includes(saved.src); }
const sentenceMode = () => saved.practice === "sentences";
const sides = () => sentenceMode() ? ["en"] : saved.dir === "mix" ? ["jp", "en"] : [saved.dir];
const deck = () => sentenceMode() ? sentences : words.filter(inDeck);
const dueSides = w => sides().filter(s => prog(w, s).due <= Date.now());
const box = w => Math.min(...sides().map(s => prog(w, s).box));   // Mix: the weaker direction

function chips(el, options, current, onPick) {
  el.innerHTML = "";
  for (const [value, label] of options) {
    const b = document.createElement("button");
    b.className = "chip" + (value === current ? " on" : "");
    b.textContent = label;
    b.onclick = () => onPick(value);
    el.appendChild(b);
  }
}

function renderHome() {
  const items = deck();
  const due = items.filter(w => dueSides(w).length).length;
  $("total").textContent = `${items.length} ${sentenceMode() ? "sentences" : "words"}`;
  $("nDue").textContent = due;
  $("nLearning").textContent = items.filter(w => { const b = box(w); return b >= 1 && b <= 3; }).length;
  $("nKnown").textContent = items.filter(w => box(w) >= 4).length;

  chips($("practiceChips"), PRACTICE, saved.practice, v => { saved.practice = v; save(); renderHome(); });
  $("dirLabel").hidden = $("dirChips").hidden = sentenceMode();   // sentences are always English first
  chips($("dirChips"), DIRS, saved.dir, v => { saved.dir = v; save(); renderHome(); });
  chips($("rateChips"), RATES, saved.rate, v => { saved.rate = v; save(); renderHome(); say("こんにちは"); });
  const sources = [...new Set(words.flatMap(w => w.src))];
  if (!sources.includes(saved.src)) saved.src = "All";
  $("srcLabel").hidden = $("srcChips").hidden = sources.length < 2 || sentenceMode();
  chips($("srcChips"), [["All", "All"], ...sources.map(s => [s, s])], saved.src, v => { saved.src = v; save(); renderHome(); });

  $("homeMsg").textContent = due ? "" : "All caught up — you can still practice.";
  $("startBtn").textContent = due ? "Start" : "Practice anyway";
}

function show(id) { for (const s of ["home", "study", "done"]) $(s).hidden = s !== id; }

// ---------- Session ----------
let queue = [], total = 0, got = 0, missed = 0, cur = null, side = "jp", state = "front";

function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; }

function start() {
  const items = deck();
  let pick = items.filter(w => dueSides(w).length);
  const anyway = !pick.length;
  if (anyway) pick = items;
  queue = shuffle(pick).slice(0, SESSION).map(w => ({ w, side: pickSide(anyway ? sides() : dueSides(w)) }));
  total = queue.length; got = 0; missed = 0;
  show("study");
  next(true);
}

function pickSide(options) { return options[Math.random() * options.length | 0]; }

function next(first) {
  stopListening();
  $("barFill").style.width = (got / total * 100) + "%";
  if (!queue.length) return finish();
  const old = document.querySelector(".card");
  if (old && !first) {
    old.classList.add("leave");
    setTimeout(() => drawCard(), 280);
  } else drawCard();
}

function fit(text, max, k) {
  const n = [...text].length;
  return `font-size:${Math.min(max, k / n).toFixed(1)}cqw`;
}

function jpFace(w, extra = "") {
  if (w.sentence) {
    const spans = list => list.map(t => `<span>${t}</span>`).join("");
    const kanji = w.parts.map(p => byKana[p]?.kanji || p);
    return extra + `<div class="kana sentence" style="${fit(w.kana, 10, 130)}">${spans(w.parts)}</div>` +
      (w.kanji ? `<div class="kanji sentence" style="${fit(w.kanji, 7, 100)}">${spans(kanji)}</div>` : "") +
      `<button class="speak" aria-label="Hear it">${SPEAKER}</button>`;
  }
  return `${extra}<div class="kana" style="${fit(w.kana, 28, 74)}">${w.kana}</div>` +
    (w.kanji ? `<div class="kanji" style="${fit(w.kanji, 12, 56)}">${w.kanji}</div>` : "") +
    `<button class="speak" aria-label="Hear it">${SPEAKER}</button>`;
}
function enFace(w, extra = "") {
  return `${extra}<div class="en" style="${w.sentence ? fit(w.en, 9, 260) : fit(w.en, 13, 130)}">${w.en}</div>`;
}
const decor = `<svg class="sparkle a" viewBox="0 0 24 24">${STAR}</svg><svg class="sparkle b" viewBox="0 0 24 24">${STAR}</svg><div class="gloss"></div>`;

function drawCard() {
  ({ w: cur, side } = queue[0]);
  state = "front";
  const pile = $("pile");
  const ghosts = Math.min(queue.length - 1, 4);
  let html = "";
  for (let i = ghosts; i >= 1; i--) html += `<div class="ghost" style="transform:translateY(${-i * 9}px) scaleX(${1 - i * .04})"></div>`;

  const front = side === "jp" ? jpFace(cur) : enFace(cur);
  const note = cur.note ? `<div class="note">${cur.note}</div>` : "";
  const back = side === "jp"
    ? enFace(cur, `<div class="small">${cur.kana}${cur.kanji ? "・" + cur.kanji : ""}</div>`) + note
    : jpFace(cur, `<div class="small">${cur.en}</div>`) + note;
  html += `<div class="card enter"><div class="inner">
      <div class="face front">${decor}${front}</div>
      <div class="face back">${decor}${back}</div>
    </div></div>`;
  pile.innerHTML = html;

  const card = pile.querySelector(".card");
  card.onclick = () => { if (state !== "done") flip(); };
  card.querySelectorAll(".speak").forEach(b => b.onclick = e => { e.stopPropagation(); say(spoken(cur)); });

  $("prompt").textContent = cur.sentence ? "Say it in Japanese" : side === "jp" ? "What does this mean?" : "How do you say this in Japanese?";
  if (side === "jp") say(spoken(cur));
  setHint("Tap the card to flip");
  frontActions();
}

function flip() {
  const card = document.querySelector(".card");
  const toBack = !card.classList.contains("flipped");
  card.classList.toggle("flipped", toBack);
  if (toBack) {
    state = "back";
    if (side === "en") say(spoken(cur));
    setHint("Did you get it?");
    gradeActions();
  } else {
    state = "front";
    setHint("Tap the card to flip");
    frontActions();
  }
}

function setHint(t, heard) { const h = $("hint"); h.textContent = t; h.classList.toggle("heard", !!heard); }

function actions(btns, layout = btns.length === 1 ? "one" : "") {
  const el = $("actions");
  el.className = "actions " + layout;
  el.innerHTML = "";
  for (const [cls, html, fn] of btns) {
    const b = document.createElement("button");
    b.className = "btn " + cls; b.innerHTML = html; b.onclick = fn;
    el.appendChild(b);
  }
}

function frontActions() {
  if (SR) actions([["blue mic", `${MIC} Say it in Japanese`, listen], ["", "Flip", flip]], "front");
  else actions([["", "Flip", flip]]);
}
function gradeActions() {
  actions([["", "Missed it", () => grade(false)], ["green", "Got it", () => grade(true)]]);
}

function grade(ok) {
  const p = prog(cur, side);
  const item = queue.shift();
  if (ok) {
    p.box = Math.min(p.box + 1, 5);
    p.due = Date.now() + INTERVALS[p.box] * DAY;
    got++;
  } else {
    p.box = 1; p.due = Date.now();
    missed++;
    queue.push(item);             // see it again this session
  }
  saved.progress[key(cur, side)] = p; save();

  if (ok && state !== "done") {   // self-graded "Got it": flash green, then move on
    state = "done";
    document.querySelector(".card").classList.add("correct");
    actions([]);
    setTimeout(() => next(), 550);
  } else if (!ok) next();
}

function finish() {
  show("done");
  $("doneMsg").textContent = missed
    ? `${total} ${sentenceMode() ? "sentences" : "words"} · ${missed} to keep practicing`
    : `${total} ${sentenceMode() ? "sentences" : "words"} · all correct`;
}

// ---------- Speech out ----------
let jaVoice = null;
// Prefer the natural-sounding Premium/Enhanced voices if they're downloaded on the phone.
function pickVoice() {
  const ja = speechSynthesis.getVoices().filter(v => v.lang.replace("_", "-").startsWith("ja"));
  const rank = v => /premium/i.test(v.name) ? 2 : /enhanced/i.test(v.name) ? 1 : 0;
  jaVoice = ja.sort((a, b) => rank(b) - rank(a))[0] || null;
}
if ("speechSynthesis" in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
// Sentences are read from their kanji, with the particle は spelled わ, so the
// voice doesn't read は as "ha". Names and breeds stay in kana (甲斐犬 can be misread).
// The card still shows the normal spelling.
function spoken(w) {
  return w.sentence ? w.parts.map(p => p === "は" ? "わ" : byKana[p]?.src && byKana[p].kanji || p).join("") : w.kana;
}
function say(text) {
  if (!("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "ja-JP"; u.rate = saved.rate === "slow" ? .6 : .9;
  if (jaVoice) u.voice = jaVoice;
  speechSynthesis.speak(u);
}

// ---------- Speech in ----------
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null;

// Katakana → hiragana, strip spaces and punctuation, so readings compare cleanly
function normJa(s) {
  return s.normalize("NFKC")
    .replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60))
    .replace(/[\s。、！？!?.,・「」ー〜~]/g, "");
}
// Whichever side is showing, the answer is always spoken in Japanese.
// The recognizer may write it in kana or kanji, so accept either.
function matches(heard) {
  if (cur.sentence) {
    // Each word may come back in kana or kanji, so build one pattern from all their spellings.
    const spellings = p => { const w = byKana[p]; return [p, w?.kanji, ...(w?.also || [])].filter(Boolean).map(normJa); };
    const re = new RegExp(cur.parts.map(p => `(?:${spellings(p).join("|")})`).join(""));
    return heard.some(h => re.test(normJa(h)));
  }
  const want = [cur.kana, cur.kanji, ...(cur.also || [])].filter(Boolean).map(normJa);
  return heard.some(h => want.some(a => normJa(h).includes(a)));
}

// Listens for up to 7 seconds, showing what it hears as you speak, and stops
// as soon as the answer matches. If nothing comes through, the hint says which
// step failed (mic never started / no sound / no speech / an error code).
function listen() {
  if (rec) { try { rec.stop(); } catch {} return; }   // tap again = done talking
  speechSynthesis.cancel();
  const r = rec = new SR();
  r.lang = "ja-JP";
  r.continuous = true;
  r.interimResults = true;
  r.maxAlternatives = 5;
  let heard = "", got = false, step = "none", err = "";
  document.querySelector(".mic")?.classList.add("listening");
  setHint("Starting mic…");
  r.onstart = () => { step = "started"; setHint("Listening… say it in Japanese"); };
  r.onaudiostart = () => { step = "audio"; };
  r.onspeechstart = () => { step = "speech"; };
  r.onresult = e => {
    const all = [];
    for (const res of e.results) for (const alt of res) all.push(alt.transcript);
    heard = [...e.results].map(res => res[0].transcript).join("");
    if (matches(all.concat(heard))) { got = true; r.stop(); correct(); }
    else setHint(`Hearing “${heard}”`);
  };
  r.onerror = e => { err = e.error; };
  r.onend = () => {
    clearTimeout(timer);
    if (rec === r) rec = null;
    document.querySelector(".mic")?.classList.remove("listening");
    if (got || state === "done") return;
    if (err === "not-allowed" || err === "service-not-allowed") setHint("Mic or Dictation is off — see Settings, or tap Flip", true);
    else if (err === "aborted") setHint("");
    else if (heard) setHint(`Heard “${heard}” — try again or flip`, true);
    else if (err) setHint(`Mic error: ${err} — tap Flip`, true);
    else if (step === "none") setHint("Mic didn’t start — tap Flip", true);
    else setHint("Didn’t hear anything — try again or flip", true);
  };
  const timer = setTimeout(() => { try { r.stop(); } catch {} }, 7000);
  try { r.start(); } catch (e) { rec = null; setHint(`Mic isn’t available (${e.name}) — tap Flip`, true); }
}
function stopListening() { if (rec) { const r = rec; rec = null; try { r.abort(); } catch {} } }

function correct() {
  const card = document.querySelector(".card");
  card.classList.add("flipped", "correct");
  state = "done";
  say(spoken(cur));
  setHint("");
  grade(true);
  actions([["green", "Continue", () => next()]]);
}

// ---------- Wiring ----------
document.addEventListener("touchstart", () => {}, { passive: true }); // lets :active press states show on iOS
$("startBtn").onclick = start;
$("quitBtn").onclick = () => { stopListening(); speechSynthesis.cancel(); renderHome(); show("home"); };
$("homeBtn").onclick = () => { renderHome(); show("home"); };
renderHome();

if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
  navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).then(r => r.update());
}
</script>
